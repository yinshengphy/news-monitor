apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: news-monitor-data
  namespace: workspace
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-monitor
  namespace: workspace
  labels:
    app: news-monitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: news-monitor
  template:
    metadata:
      labels:
        app: news-monitor
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: news-monitor
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          export PYTHONPATH=/opt/site-packages:/opt/hermes-src${PYTHONPATH:+:$PYTHONPATH}
          python3 /opt/app/monitor.py
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: HTTP_PROXY
          value: http://127.0.0.1:7890
        - name: HTTPS_PROXY
          value: http://127.0.0.1:7890
        - name: ALL_PROXY
          value: http://127.0.0.1:7890
        - name: NO_PROXY
          value: localhost,127.0.0.1,::1,192.168.31.53,192.168.31.0/24,10.42.0.0/16,10.43.0.0/16
        - name: NEWS_DB_PATH
          value: /data/news.db
        - name: POLL_INTERVAL_SECONDS
          value: "180"
        - name: HEARTBEAT_PATH
          value: /tmp/news_monitor_heartbeat
        - name: HERMES_HOME
          value: /data/hermes
        - name: CLIPROXY_BASE_URL
          value: http://127.0.0.1:8317/v1
        - name: PRIMARY_MODEL
          value: gemini-3.7-flash-high
        - name: FALLBACK_MODEL
          value: gpt-5.6-luna
        - name: MODEL_TIMEOUT_SECONDS
          value: "25"
        - name: WEIXIN_RECEIVER
          value: o9cq80-itgP5_UnL3cyqo9gv9JBg@im.wechat
        - name: CLIPROXY_API_KEY
          valueFrom:
            secretKeyRef:
              name: news-monitor-secrets
              key: CLIPROXY_API_KEY
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "test $(($(date +%s) - $(stat -c %Y /tmp/news_monitor_heartbeat 2>/dev/null || echo 0))) -lt 600"
          initialDelaySeconds: 45
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: app-code
          mountPath: /opt/app
        - name: hermes-site-packages
          mountPath: /opt/site-packages
          readOnly: true
        - name: hermes-source
          mountPath: /opt/hermes-src
          readOnly: true
        - name: host-hermes
          mountPath: /home/yinsheng/.hermes
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: news-monitor-data
      - name: app-code
        hostPath:
          path: /home/yinsheng/k3s-news-monitor
          type: Directory
      - name: hermes-site-packages
        hostPath:
          path: /home/yinsheng/.hermes/hermes-agent/venv/lib/python3.11/site-packages
          type: Directory
      - name: hermes-source
        hostPath:
          path: /home/yinsheng/.hermes/hermes-agent
          type: Directory
      - name: host-hermes
        hostPath:
          path: /home/yinsheng/.hermes
          type: Directory
